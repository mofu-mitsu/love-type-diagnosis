<body>
  <div class="container">
    <header><h1><i class="fa-solid fa-heart-pulse"></i> 恋愛スタイル診断</h1></header>

    <main>
      <section id="start-screen" class="screen active">
        <div class="start-box">
          <!-- ホームへ戻るリンク -->
          <a href="https://mofu-mitsu.github.io/lab.html" class="home-link"><i class="fa-solid fa-house"></i> ホームへ戻る</a>
          
          <h2>あなたの恋愛での「素顔」を暴きます！</h2>
          <div class="identity-input-box">
            <label for="type-input"><i class="fa-solid fa-pen-nib"></i> あなたの自認タイプ（任意）</label>
            <input type="text" id="type-input" placeholder="例：INTJ、5w6、LII など">
          </div>
          <button id="start-btn" class="btn btn-large">診断をスタート！</button>
        </div>
      </section>

      <section id="checkbox-screen" class="screen">
        <h2><i class="fa-regular fa-square-check"></i> Part 1: 直感でチェック！</h2>
        <div id="checkbox-container"></div>
        <button id="to-room-btn" class="btn">次へ（お部屋探索へ）</button>
      </section>

      <section id="room-screen" class="screen">
        <div id="gauge-container">
          <h3>📊 現在の傾向</h3>
          <div class="gauge-row"><span>⚔️ 侵略</span><div class="bar-bg"><div id="bar-aggressor" class="bar aggressor"></div></div></div>
          <div class="gauge-row"><span>⛓️ 犠牲</span><div class="bar-bg"><div id="bar-victim" class="bar victim"></div></div></div>
          <div class="gauge-row"><span>🍵 保護</span><div class="bar-bg"><div id="bar-caring" class="bar caring"></div></div></div>
          <div class="gauge-row"><span>🧸 子ども</span><div class="bar-bg"><div id="bar-childlike" class="bar childlike"></div></div></div>
        </div>

        <h2><i class="fa-solid fa-magnifying-glass"></i> Part 2: お部屋探索</h2>
        <p id="room-guide">気になるアイテムや人物（全7個）をタップ！</p>
        
        <div id="room">
          <button class="room-item" id="item-phone">📱</button>
          <button class="room-item" id="item-table">🍱</button>
          <button class="room-item" id="item-door">🚪</button>
          <button class="room-item" id="item-sofa">🛋️</button>
          <button class="room-item" id="item-darling">👩🏻‍💻</button>
          <button class="room-item" id="item-pc">💻</button>
          <button class="room-item" id="item-eye">👁️</button>

          <div id="item-bug">🐛</div>
          <div id="bug-speech" class="hidden"></div>
        </div>
        
        <button id="submit-btn" class="btn hidden">診断結果を見る！</button>
      </section>

      <section id="result-screen" class="screen">
        <div id="capture-area">
          <h2>🎉 診断結果</h2>
          <div id="result-identity" class="result-identity"></div>
          <div id="result-content"></div>
        </div>

        <div class="share-actions">
          <button id="save-img-btn" class="btn action-btn" style="background:#0984e3;"><i class="fa-solid fa-camera"></i> 画像保存</button>
          <button id="share-nav-btn" class="btn action-btn" style="background:#2d3436;"><i class="fa-solid fa-share-nodes"></i> シェアする</button>
        </div>

        <div id="img-output-area" class="hidden">
          <p style="color:#e17055; font-weight:bold; font-size:14px;"><i class="fa-solid fa-mobile-screen"></i> スマホの人は下の画像を【長押し】して保存してね！</p>
          <img id="result-image" src="" alt="診断結果" style="max-width:100%; border:2px solid #ccc; border-radius:8px;">
        </div>

        <button id="retry-btn" class="btn" style="margin-top:20px;">もう一度診断する</button>

        <!-- ★ NEW! 理想診断への動線バナー ★ -->
        <div class="next-diagnosis-banner" style="margin-top: 35px; padding: 20px; background: #fdfbfb; border: 2px dashed #0984e3; border-radius: 12px; text-align: center;">
          <p style="color: #0984e3; font-weight: bold; font-size: 15px; margin-top: 0; margin-bottom: 12px;">
            ＼ あなたが惹かれる「本当の理想」も暴いてみる？ ／
          </p>
          <a href="https://mofu-mitsu.github.io/ideal-partner-diagnosis/" class="btn" style="background: linear-gradient(135deg, #6c5ce7, #a29bfe); text-decoration: none; display: block; box-shadow: 0 4px 15px rgba(108, 92, 231, 0.3);">
            <i class="fa-solid fa-vial-circle-check"></i> 理想のソシオ恋愛診断 へ！
          </a>
        </div>
      </section>
    </main>
  </div>
